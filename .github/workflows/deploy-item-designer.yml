name: Deploy Item Designer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "item-designer-deploy"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: item-designer

      - name: Build
        run: npm run build
        working-directory: item-designer

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          umask 077
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPERACE_160D3 }}' > /tmp/firebase-sa.json
          npx firebase-tools deploy --only hosting:item-designer --project typerace-160d3
          rm -f /tmp/firebase-sa.json
