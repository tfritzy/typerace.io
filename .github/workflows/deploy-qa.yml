name: Deploy QA Environment

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "qa-deploy-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install SpacetimeDB CLI
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://install.spacetimedb.com | sh -s -- -y
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          spacetime version install 1.12.0
          spacetime version use 1.12.0

      - name: Login to SpacetimeDB
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
        run: |
          spacetime login --token "$SPACETIMEDB_TOKEN"

      - name: Publish SpacetimeDB Module (QA)
        run: |
          spacetime publish -c -y -s maincloud --project-path spacetimedb typerace-qa

      - name: Generate TypeScript bindings
        run: |
          spacetime generate --lang typescript --out-dir frontend/module_bindings --project-path spacetimedb

      - name: Build with Vite (QA)
        run: npm run build -- --mode qa
        working-directory: frontend

      - name: Deploy to Firebase Hosting (QA)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TYPERACE_160D3 }}' > /tmp/firebase-sa.json
          chmod 600 /tmp/firebase-sa.json
          npx firebase-tools deploy --only hosting:qa --project typerace-160d3
          rm -f /tmp/firebase-sa.json
