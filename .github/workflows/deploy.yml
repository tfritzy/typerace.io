name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install SpacetimeDB CLI
        run: |
          curl -fsSL https://install.spacetimedb.com | bash
          echo "$HOME/.spacetime/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci

      - name: Deploy SpacetimeDB module
        env:
          SPACETIME_TOKEN: ${{ secrets.SPACETIME_TOKEN }}
        run: |
          if [ -n "$SPACETIME_TOKEN" ]; then
            spacetime identity set-default --token "$SPACETIME_TOKEN"
            npm run deploy
          else
            echo "Warning: SPACETIME_TOKEN not set, skipping SpacetimeDB deployment"
            echo "Generating module bindings locally for build"
            cd spacetimedb && npm run build && cd ..
            spacetime generate --lang typescript --out-dir src/module_bindings --project-path spacetimedb
          fi

      - name: Build frontend
        run: npm run build

      - name: Add .nojekyll
        run: touch ./dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
