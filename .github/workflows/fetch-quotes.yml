name: Fetch WikiQuote Quotes

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fetch_wikiquote_quotes.py'
      - '.github/workflows/fetch-quotes.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch_wikiquote_quotes.py'

permissions:
  contents: write

jobs:
  fetch-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install wikiquote google-generativeai

      - name: Fetch quotes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_wikiquote_quotes.py

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add spacetimedb/quotes/
          git diff --staged --quiet || git commit -m "Update WikiQuote quotes"
          git push

      - name: Upload quotes as artifact (for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: generated-quotes
          path: spacetimedb/quotes/
