    <script>
      (function() {
        try {
          var themes = {
            EverforestDark:{bg:'#2d353b',fg:'#d3c6aa',ac:'#a7c080',bc:'#475258',bw:1,br:8},
            GitHubDarkDimmed:{bg:'#22272e',fg:'#adbac7',ac:'#57ab5a',bc:'#444c56',bw:1,br:8},
            NightOwl:{bg:'#011627',fg:'#d6deeb',ac:'#82aaff',bc:'#122d42',bw:1,br:8},
            Cobalt2:{bg:'#122738',fg:'#ffffff',ac:'#ffc600',bc:'#0d3a58',bw:1,br:8},
            Dracula:{bg:'#282a36',fg:'#f8f8f2',ac:'#bd93f9',bc:'rgba(248,248,242,0.1)',bw:1,br:8},
            Monokai:{bg:'#272822',fg:'#f8f8f2',ac:'#a6e22e',bc:'rgba(248,248,242,0.1)',bw:1,br:8},
            Nord:{bg:'#2e3440',fg:'#eceff4',ac:'#88c0d0',bc:'rgba(236,239,244,0.1)',bw:1,br:12},
            TokyoNight:{bg:'#1a1b26',fg:'#a9b1d6',ac:'#7aa2f7',bc:'rgba(169,177,214,0.1)',bw:1,br:8},
            GruvboxDark:{bg:'#282828',fg:'#ebdbb2',ac:'#fabd2f',bc:'rgba(235,219,178,0.1)',bw:1,br:8},
            CatppuccinMocha:{bg:'#1e1e2e',fg:'#cdd6f4',ac:'#cba6f7',bc:'rgba(205,214,244,0.1)',bw:1,br:8},
            OneDark:{bg:'#282c34',fg:'#abb2bf',ac:'#61afef',bc:'rgba(171,178,191,0.1)',bw:1,br:8},
            AyuDark:{bg:'#0d1017',fg:'#bfbdb6',ac:'#e6b450',bc:'rgba(191,189,182,0.1)',bw:1,br:8},
            Kanagawa:{bg:'#1f1f28',fg:'#dcd7ba',ac:'#7e9cd8',bc:'rgba(220,215,186,0.1)',bw:1,br:8},
            Pico8:{bg:'#1D2B53',fg:'#FFF1E8',ac:'#29ADFF',bc:'rgba(255,241,232,0.20)',bw:2,br:0},
            Endesga:{bg:'#10141f',fg:'#c5dbd4',ac:'#f77622',bc:'rgba(197,219,212,0.20)',bw:2,br:0},
            Sweetie16:{bg:'#1a1c2c',fg:'#f4f4f4',ac:'#b13e53',bc:'rgba(244,244,244,0.20)',bw:2,br:0}
          };
          var saved = localStorage.getItem('selectedTheme');
          var t = saved && themes[saved] ? themes[saved] : null;
          if (!t && saved === 'custom') {
            try {
              var raw = localStorage.getItem('customTheme');
              if (raw) {
                var c = JSON.parse(raw);
                t = {bg:c.backgroundColor,fg:c.textColor,ac:c.accentColor,bc:c.borderColor,bw:c.borderWidth||1,br:c.borderRadius||8};
              }
            } catch(_){}
          }
          if (!t) {
            t = themes.Kanagawa;
          }
          function p(h){h=h.replace('#','');return[parseInt(h.substring(0,2),16),parseInt(h.substring(2,4),16),parseInt(h.substring(4,6),16)];}
          function cl(v){return Math.max(0,Math.min(255,Math.round(v)));}
          function hx(v){return cl(v).toString(16).padStart(2,'0');}
          function adj(hex,a){var c=p(hex);return'#'+hx(c[0]+a)+hx(c[1]+a)+hx(c[2]+a);}
          function adjA(hex,a){var c=p(hex);if(a>0)return'#'+hx(c[0]+(255-c[0])*a)+hx(c[1]+(255-c[1])*a)+hx(c[2]+(255-c[2])*a);var f=1+a;return'#'+hx(c[0]*f)+hx(c[1]*f)+hx(c[2]*f);}
          var fg=p(t.fg),bgc=p(t.bg),fga=fg[0]+','+fg[1]+','+fg[2];
          var dk=(0.299*bgc[0]+0.587*bgc[1]+0.114*bgc[2])/255<0.5;
          var card=dk?adj(t.bg,12):adj(t.bg,-10);
          var pop=dk?adj(t.bg,20):adj(t.bg,-10);
          var inp=dk?adj(t.bg,-8):adj(t.bg,-5);
          var acL=adjA(t.ac,0.2),acD=adjA(t.ac,-0.25);
          var acCon=(0.299*p(t.ac)[0]+0.587*p(t.ac)[1]+0.114*p(t.ac)[2])/255>0.5?'#000000':'#ffffff';
          var ioOp=dk?0.25:0.45;
          var r=document.documentElement.style;
          var favicon=document.getElementById('theme-favicon');
          var tileColor=/^#[0-9a-f]{6}$/i.test(t.ac)?t.ac:'#7e9cd8';
          var glyphColor=/^#[0-9a-f]{6}$/i.test(t.bg)?t.bg:'#1f1f28';
          var faviconSvg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="'+glyphColor+'"/><path fill="'+tileColor+'" d="m 96.280383,367.24 q -4.84,-11.88 -7.04,-27.28 -2.2,-15.84 -2.2,-44 0,-28.16 10.56,-76.12 h -19.8 q -5.28,0 -5.28,-4.4 0,-10.56 1.76,-17.16 2.2,-7.04 9.68,-15.84 h 10.56 q 6.159997,0 13.199997,-0.44 21.12,-67.76 43.12,-67.76 17.6,0.44 24.64,22.44 1.76,6.16 3.96,13.2 l -18.04,31.68 q 30.8,0.88 38.72,0.88 8.36,0 8.8,1.76 0.88,1.32 0.88,4.4 0,7.92 -3.96,19.8 -3.52,11.88 -8.36,11.44 l -44,-2.2 q -9.24,53.68 -9.24,88.88 0,35.2 10.12,35.2 8.36,0 30.36,-13.64 22,-14.08 31.68,-26.84 9.68,-12.76 15.84,-12.76 6.16,0 6.16,14.96 0,14.96 -10.56,30.8 -10.56,15.4 -26.84,28.6 -15.84,12.76 -35.64,21.12 -19.36,8.36 -33.88,8.36 -14.52,0 -22.44,-6.6 -7.48,-7.04 -12.759997,-18.48 z m 184.359747,-50.16 2.64,53.68 q 0,10.56 -11,18.92 -11,8.36 -29.92,8.36 -11,0 -15.4,-11.44 -3.96,-11.44 -3.96,-33.44 0,-46.2 4.4,-72.16 4.84,-26.4 18.48,-53.24 -20.24,-19.36 -20.24,-33.44 0,-29.48 31.68,-29.48 16.28,0 28.6,17.16 8.8,11.88 12.76,27.72 6.16,2.2 15.4,2.2 12.76,0 29.48,-8.36 l 11.44,-5.72 q 5.28,-2.64 9.24,-2.64 12.76,0 25.52,37.4 -3.96,17.16 -8.8,33 -4.4,15.84 -10.56,38.28 -6.16,22.44 -6.6,30.36 0,7.48 4.84,7.48 6.6,0 16.28,-8.36 9.68,-8.36 19.36,-18.04 9.68,-10.12 17.6,-18.48 8.36,-8.36 11.44,-8.36 6.16,0 6.16,14.96 0,30.36 -26.84,59.84 -26.4,29.48 -60.72,29.04 -20.24,0 -30.36,-16.28 -10.12,-16.28 -10.56,-39.6 0,-46.2 20.68,-87.56 -9.68,3.96 -22,3.96 -11.88,0 -17.16,-0.88 -3.96,16.72 -7.92,33.88 -3.96,16.72 -3.96,31.24 z"/></svg>';
          var faviconHref='data:image/svg+xml,'+encodeURIComponent(faviconSvg);
          if(favicon){
            favicon.href=faviconHref;
            window.addEventListener('load',function(){
              favicon.href=faviconHref;
            },{once:true});
          }
          document.documentElement.dataset.mode = dk ? 'dark' : 'light';
          r.setProperty('--background',t.bg);
          r.setProperty('--foreground',t.fg);
          r.setProperty('--card',card);
          r.setProperty('--card-foreground',t.fg);
          r.setProperty('--popover',pop);
          r.setProperty('--popover-foreground',t.fg);
          r.setProperty('--primary',t.ac);
          r.setProperty('--primary-foreground',acCon);
          r.setProperty('--secondary',dk?'rgba('+fga+',0.08)':'rgba('+fga+',0.06)');
          r.setProperty('--secondary-foreground',dk?'rgba('+fga+',0.9)':'rgba('+fga+',0.8)');
          r.setProperty('--muted','rgba('+fga+',0.04)');
          r.setProperty('--muted-foreground','rgba('+fga+',0.5)');
          r.setProperty('--accent',t.ac);
          r.setProperty('--accent-foreground',acCon);
          r.setProperty('--accent-primary',t.ac);
          r.setProperty('--accent-light',acL);
          r.setProperty('--accent-dark',acD);
          r.setProperty('--destructive',dk?'#f85149':'#d1242f');
          r.setProperty('--destructive-foreground',dk?t.fg:'#ffffff');
          r.setProperty('--border',t.bc);
          r.setProperty('--input',inp);
          r.setProperty('--ring',t.ac);
          r.setProperty('--grid-line','rgba('+fga+',0.06)');
          r.setProperty('--text-completed',dk?'rgba('+fga+',0.15)':'rgba('+fga+',0.2)');
          r.setProperty('--text-untyped',dk?'rgba('+fga+',0.35)':'rgba('+fga+',0.4)');
          r.setProperty('--border-hover','rgba('+fga+',0.25)');
          r.setProperty('--color-accent',t.ac);
          r.setProperty('--color-accent-light',acL);
          r.setProperty('--color-accent-dark',acD);
          r.setProperty('--color-bg-primary',t.bg);
          r.setProperty('--color-white',t.fg);
          r.setProperty('--color-white-25','rgba('+fg[0]+','+fg[1]+','+fg[2]+','+ioOp+')');
          r.setProperty('--color-box-bg',card);
          r.setProperty('--color-box-border',t.bc);
          r.setProperty('--border-width',t.bw+'px');
          r.setProperty('--radius',t.br+'px');
        } catch (e) {}
      })();
    </script>
