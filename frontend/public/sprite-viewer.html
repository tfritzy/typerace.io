<!DOCTYPE html>
<html>
<head>
<style>
body { background: #1e1e2e; color: white; font-family: monospace; }
.grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; }
.ship { text-align: center; border: 1px solid #444; padding: 4px; width: 100px; }
.ship canvas { image-rendering: pixelated; }
.ship .name { font-size: 10px; margin-top: 2px; }
.ship .idx { font-size: 8px; color: #888; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
const SHIPS = [
  "Vanguard", "Sentinel", "Corsair", "Dynamo", "Scout", "Dart", "Wasp",
  "Inferno", "Hawk", "Sparrow", "Gnat", "Stinger", "Needle", "Pulse",
  "Titan", "Raptor", "Lance", "Grace", "Pip", "Raven", "Osprey",
  "Leviathan", "Talon", "Hornet", "Bastion", "Dreadnought", "Marauder",
  "Eagle", "Mender", "Tender", "Haven", "Warden", "Prism", "Harrier",
  "Viper", "Flea", "Broadside", "Kestrel", "Flare", "Striker", "Robin",
  "Cricket", "Moth", "Colossus", "Cutlass", "Sabre", "Mantis", "Buckler",
  "Crest", "Ember", "Vulture", "Nova", "Ward", "Barb", "Spark",
  "Flagship", "Aegis", "Bolt", "Spur", "Dot", "Corona", "Clipper",
];

const FRAMES = {"ship-0":{"x":119,"y":4,"w":32,"h":29},"ship-1":{"x":235,"y":5,"w":22,"h":28},"ship-2":{"x":70,"y":7,"w":33,"h":24},"ship-3":{"x":280,"y":7,"w":30,"h":24},"ship-4":{"x":3,"y":9,"w":21,"h":20},"ship-5":{"x":36,"y":9,"w":22,"h":20},"ship-6":{"x":189,"y":9,"w":24,"h":19},"ship-7":{"x":34,"y":37,"w":26,"h":27},"ship-8":{"x":115,"y":40,"w":25,"h":22},"ship-9":{"x":82,"y":41,"w":23,"h":20},"ship-10":{"x":238,"y":42,"w":17,"h":18},"ship-11":{"x":276,"y":42,"w":24,"h":19},"ship-12":{"x":205,"y":43,"w":22,"h":16},"ship-13":{"x":175,"y":46,"w":16,"h":10},"ship-14":{"x":197,"y":69,"w":32,"h":27},"ship-15":{"x":263,"y":70,"w":26,"h":24},"ship-16":{"x":11,"y":73,"w":33,"h":20},"ship-17":{"x":82,"y":73,"w":38,"h":20},"ship-18":{"x":130,"y":75,"w":14,"h":16},"ship-19":{"x":167,"y":100,"w":26,"h":29},"ship-20":{"x":137,"y":101,"w":22,"h":28},"ship-21":{"x":219,"y":101,"w":48,"h":27},"ship-22":{"x":37,"y":103,"w":25,"h":25},"ship-23":{"x":95,"y":106,"w":21,"h":18},"ship-24":{"x":46,"y":131,"w":33,"h":31},"ship-25":{"x":199,"y":132,"w":57,"h":29},"ship-26":{"x":269,"y":134,"w":39,"h":26},"ship-27":{"x":1,"y":135,"w":28,"h":24},"ship-28":{"x":112,"y":139,"w":20,"h":16},"ship-29":{"x":155,"y":139,"w":23,"h":16},"ship-30":{"x":42,"y":164,"w":37,"h":30},"ship-31":{"x":217,"y":166,"w":32,"h":26},"ship-32":{"x":135,"y":167,"w":20,"h":23},"ship-33":{"x":95,"y":168,"w":28,"h":22},"ship-34":{"x":182,"y":170,"w":23,"h":20},"ship-35":{"x":287,"y":170,"w":15,"h":18},"ship-36":{"x":71,"y":198,"w":36,"h":24},"ship-37":{"x":269,"y":200,"w":26,"h":21},"ship-38":{"x":3,"y":201,"w":21,"h":19},"ship-39":{"x":180,"y":201,"w":27,"h":19},"ship-40":{"x":132,"y":202,"w":21,"h":17},"ship-41":{"x":221,"y":202,"w":23,"h":18},"ship-42":{"x":37,"y":203,"w":20,"h":16},"ship-43":{"x":131,"y":227,"w":39,"h":31},"ship-44":{"x":68,"y":231,"w":34,"h":23},"ship-45":{"x":212,"y":231,"w":35,"h":24},"ship-46":{"x":17,"y":232,"w":23,"h":21},"ship-47":{"x":270,"y":236,"w":16,"h":14},"ship-48":{"x":50,"y":264 const img = new Image();
img.src = '/pixel_starships_kit/SpaceShips/Spaceships.png';
img.onload = () => {
  const grid = document.getElementById('grid');
  for (let i = 0; i < SHIPS.length; i++) {
    const f = FRAMES[`ship-${i}`];
    const div = document.createElement('div');
    div.className = 'ship';
    const c = document.createElement('canvas');
    c.width = f.w * 3;
    c.height = f.h * 3;
    c.style.width = f.w * 3 + 'px';
    c.style.height = f.h * 3 + 'px';
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, f.x, f.y, f.w, f.h, 0, 0, f.w * 3, f.h * 3);
    div.appendChild(c);
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = SHIPS[i];
    div.appendChild(name);
    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = `#${i}`;
    div.appendChild(idx);
    grid.appendChild(div);
  }
};
</script>
</body>
</html>
